<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{Title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f1ee; font-family:'Segoe UI', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ee; padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <tr>
                        <td style="background-color:#2e7d32; padding:24px 32px; text-align:center;">
                            <h1 style="margin:0; color:#ffffff; font-size:20px;">✅ Smart Coffee Builder</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin:0 0 16px; color:#2e7d32; font-size:18px;">{{Title}}</h2>
                            <p style="margin:0 0 24px; color:#333333; font-size:15px; line-height:1.6;">
                                {{Content}}
                            </p>
                            <p style="margin:0; color:#666666; font-size:14px; line-height:1.6;">
                                Sign in to talk with the shop owner and start the work.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#faf8f6; padding:16px 32px; text-align:center; border-top:1px solid #eeeeee;">
                            <p style="margin:0; color:#999999; font-size:12px;">
                                &copy; {{Year}} Smart Coffee Builder. This email was sent automatically — please do not reply.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
